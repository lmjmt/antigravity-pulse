name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python bytecode
        run: python3 -m compileall -q sidecars/task_monitor tests hooks
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check JS syntax & portability scan
        run: ./scripts/check.sh
