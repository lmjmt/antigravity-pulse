name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run verification suite
        run: ./scripts/check.sh

      - name: Build clean release archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          STAGE="dist/antigravity-pulse-${TAG_NAME}"
          mkdir -p "$STAGE"
          for item in assets hooks rules skills sidecars scripts plugin.json hooks.json README.md README.zh-CN.md CHANGELOG.md LICENSE; do
            cp -R "$item" "$STAGE/"
          done
          find "$STAGE" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$STAGE" -name "*.pyc" -delete 2>/dev/null || true

          (cd dist && tar -czf "antigravity-pulse-${TAG_NAME}.tar.gz" "antigravity-pulse-${TAG_NAME}")
          (cd dist && zip -rq "antigravity-pulse-${TAG_NAME}.zip" "antigravity-pulse-${TAG_NAME}")
          (cd dist && sha256sum "antigravity-pulse-${TAG_NAME}.tar.gz" "antigravity-pulse-${TAG_NAME}.zip" > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/antigravity-pulse-${{ github.ref_name }}.tar.gz
            dist/antigravity-pulse-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
